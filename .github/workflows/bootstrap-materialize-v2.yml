name: Bootstrap Human Request Compiler v2

on:
  push:
    branches: [agent/bootstrap-human-request-compiler]
    paths: [bootstrap/GO]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-human-request-compiler
          fetch-depth: 0
      - name: Materialize repository tree without workflows
        run: |
          cat bootstrap/repository.tar.gz.b64.* | base64 --decode | tar -xz --exclude='.github/workflows/*'
          rm -f bootstrap/repository.tar.gz.b64.* bootstrap/READY bootstrap/GO
          rmdir bootstrap 2>/dev/null || true
      - name: Commit materialized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement human request compiler"
          git push origin HEAD:agent/bootstrap-human-request-compiler
