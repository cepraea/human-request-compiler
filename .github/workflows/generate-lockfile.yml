name: Generate npm lockfile

on:
  push:
    branches: [agent/bootstrap-human-request-compiler]
    paths: [lockfile/GENERATE]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-human-request-compiler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Report production dependency audit
        run: npm audit --omit=dev || true
      - name: Commit lockfile
        run: |
          rm -f lockfile/GENERATE
          rmdir lockfile 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lockfile/GENERATE
          git commit -m "build: add npm dependency lockfile"
          git push origin HEAD:agent/bootstrap-human-request-compiler
